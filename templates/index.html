<!DOCTYPE html>
<html>
<head>
    <title>Crop Yield Dashboard</title>
</head>
<body>

    <h1>🌱 Crop Yield Dashboard</h1>

    <h2>Total Yield per Farm</h2>
    <p>{{ data.total_per_farm }}</p>

    <h2>Total Yield per Month</h2>
    <p>{{ data.total_per_month }}</p>

    <h2>Best Farm</h2>
    <p>Farm Index: {{ data.best_farm }}</p>

    <h2>Worst Farm</h2>
    <p>Farm Index: {{ data.worst_farm }}</p>

    <h2>Average Yield per Farm</h2>
    <p>{{ data.average_per_farm }}</p>

</body>
</html>
